name: Deploy frontend to GitHub Pages

# Requires Settings → Pages → Build and deployment → Source: GitHub Actions.
on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      # Fails fast with a clear message until Pages is enabled in
      # Settings → Pages → Source: GitHub Actions. The workflow token cannot
      # create the Pages site itself.
      - uses: actions/configure-pages@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund

      # Set the repository variable VITE_API_URL (Settings → Secrets and
      # variables → Actions → Variables) to the deployed API, e.g.
      # https://api.example.com/api. Without it the site still renders and the
      # gallery falls back to bundled photos.
      - name: Build
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      # GitHub Pages has no SPA rewrites; serving index.html for unknown paths
      # lets client-side routes like /about survive a hard refresh.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
